<script>
/* ==========================================================================
   0. ESTADO GLOBAL Y DATOS DE DEMOSTRACIÓN
   ========================================================================== */
const DEMO_DATA = {
  pathogens: [
    {
      id: "path-escherichia-coli",
      name: "Escherichia coli",
      type: "bacteria",
      topic: "Bacteriología Médica",
      subtopic: "Enterobacterias",
      summary: "Bacilo Gram negativo anaerobio facultativo, habitual en la microbiota intestinal.",
      keywords: "gram negativo, bacilo, diarrea, infección urinaria",
      isDemo: true,
      sections: {
        "Microbiología": "Bacilo Gram negativo, móvil por flagelos perítricos.",
        "Patogenia": "Causa infecciones del tracto urinario, gastroenteritis y sepsis."
      }
    }
  ],
  topics: [
    { id: "topic-bacteriologia", name: "Bacteriología Médica", description: "Estudio de bacterias patógenas y microbiota." }
  ],
  concepts: [
    {
      id: "conc-tinción-gram",
      name: "Tinción de Gram",
      topic: "Bacteriología Médica",
      keywords: "gram, tinción, pared celular",
      content: "Técnica fundamental para clasificar bacterias en Gram positivas y Gram negativas según la estructura de su pared.",
      isDemo: true
    }
  ],
  flashcards: [
    {
      id: "fc-1",
      question: "¿Qué tipo de tinción identifica a Escherichia coli como Gram negativa?",
      answer: "La Tinción de Gram (se tiñe de color rosado/rojo).",
      topic: "Bacteriología Médica",
      type: "bacteria"
    }
  ],
  progress: {}
};

const AppState = {
  pathogens: [],
  topics: [],
  concepts: [],
  flashcards: [],
  progress: {},
  config: { theme:'light', fontSize:'medium', compact:'false' }
};

/* ==========================================================================
   1. UTILIDADES
   ========================================================================== */
function cloneData(data){ return JSON.parse(JSON.stringify(data)); }

function sanitizeHTML(html){
  const template = document.createElement('template');
  template.innerHTML = html || '';
  template.content.querySelectorAll('script, iframe, object, embed, link, meta, style').forEach(el => el.remove());
  template.content.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      const value = (attr.value || '').trim().toLowerCase();
      if (name.startsWith('on') || value.startsWith('javascript:') || value.startsWith('data:text/html')) {
        el.removeAttribute(attr.name);
      }
    });
  });
  return template.innerHTML;
}

function escapeHTML(value){
  const div = document.createElement('div');
  div.textContent = value ?? '';
  return div.innerHTML;
}

function normalizeText(value){
  return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

function getTypeLabel(type){
  return ({bacteria:'Bacteria', virus:'Virus', fungus:'Hongo', parasite:'Parásito'})[type] || type || 'Microorganismo';
}
function getTypeIcon(type){
  return ({bacteria:'🧫', virus:'🦠', fungus:'🍄', parasite:'🪱'})[type] || '🔬';
}
function getTypeBadgeClass(type){
  return ({bacteria:'badge-bacteria', virus:'badge-virus', fungus:'badge-fungus', parasite:'badge-parasite'})[type] || 'badge-bacteria';
}

/* ==========================================================================
   2. ALMACENAMIENTO — LOCAL (localStorage)
   ========================================================================== */
const STORAGE_KEY = 'pad_bautista_zarate_biblioteca';

function serializeLibrary(){
  return JSON.stringify({
    pathogens: AppState.pathogens,
    topics: AppState.topics,
    concepts: AppState.concepts,
    flashcards: AppState.flashcards,
    progress: AppState.progress
  });
}

function applyLibraryPayload(payload){
  if (!payload) return false;
  AppState.pathogens = Array.isArray(payload.pathogens) ? payload.pathogens : [];
  AppState.topics = Array.isArray(payload.topics) ? payload.topics : [];
  AppState.concepts = Array.isArray(payload.concepts) ? payload.concepts : [];
  AppState.flashcards = Array.isArray(payload.flashcards) ? payload.flashcards : [];
  AppState.progress = payload.progress || {};
  return true;
}

async function saveToStorage(){
  const raw = serializeLibrary();
  try {
    localStorage.setItem(STORAGE_KEY, raw);
  } catch(e) {
    console.warn('No se pudo guardar en localStorage:', e);
  }
  setSyncState('local-only');
}

async function loadFromStorage(){
  let payload = null;

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      payload = JSON.parse(raw);
    }
  } catch(e) {
    console.warn('No se pudo leer localStorage:', e);
  }

  if (payload) {
    applyLibraryPayload(payload);
  } else {
    applyLibraryPayload(cloneData(DEMO_DATA));
    await saveToStorage();
  }

  loadConfigFromStorage();
  setSyncState('local-only');
}

function loadConfigFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY + '_config');
    if (raw) AppState.config = { ...AppState.config, ...JSON.parse(raw) };
  }catch(e){ /* ignora */ }
}
function saveConfigToStorage(){
  try{ localStorage.setItem(STORAGE_KEY + '_config', JSON.stringify(AppState.config)); }catch(e){ /* ignora */ }
}

function setSyncState(state){
  const dot = document.getElementById('sidebarSyncDot');
  const text = document.getElementById('sidebarSyncText');
  const header = document.getElementById('headerSyncStatus');
  const homeTitle = document.getElementById('homeSyncTitle');
  const homeDetail = document.getElementById('homeSyncDetail');
  const toolsTitle = document.getElementById('toolsSyncTitle');
  const toolsDetail = document.getElementById('toolsSyncDetail');
  const cfgDetail = document.getElementById('cfgStorageDetail');

  const label = 'Almacenamiento Local Activo';
  const headerLabel = '💾 Solo este dispositivo';
  const detail = 'Tus datos se están guardando en el LocalStorage de este navegador.';

  if (dot) dot.className = 'sync-dot local';
  if (text) text.textContent = label;
  if (header) header.textContent = headerLabel;
  if (homeTitle) homeTitle.textContent = label;
  if (homeDetail) homeDetail.textContent = detail;
  if (toolsTitle) toolsTitle.textContent = label;
  if (toolsDetail) toolsDetail.textContent = detail;
  if (cfgDetail) cfgDetail.textContent = detail;
  const homeIcon = document.querySelector('#homeSyncCard .ss-icon');
  const toolsIcon = document.querySelector('#toolsSyncCard .ss-icon');
  if (homeIcon) homeIcon.textContent = '💾';
  if (toolsIcon) toolsIcon.textContent = '💾';
}

/* ==========================================================================
   3. EXPORTAR / IMPORTAR COPIA DE SEGURIDAD
   ========================================================================== */
function exportLibraryJSON(){
  const data = {
    pathogens: AppState.pathogens, topics: AppState.topics,
    concepts: AppState.concepts, flashcards: AppState.flashcards,
    progress: AppState.progress, exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'biblioteca-pad-bautista-zarate.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importLibraryJSON(file){
  const feedback = document.getElementById('importFeedback');
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const payload = JSON.parse(e.target.result);
      const merge = confirm('¿Deseas FUSIONAR este archivo con tu biblioteca actual? Aceptar = fusionar (recomendado). Cancelar = reemplazar todo.');
      if (merge){
        mergeLibraryPayload(payload);
      } else {
        applyLibraryPayload(payload);
      }
      await saveToStorage();
      refreshAllViews();
      if (feedback){ feedback.style.color = '#1f6b3a'; feedback.textContent = 'Copia de seguridad importada correctamente.'; }
    }catch(err){
      if (feedback){ feedback.style.color = '#b91c1c'; feedback.textContent = 'Error al leer el archivo: ' + err.message; }
    }
  };
  reader.readAsText(file);
}

function mergeLibraryPayload(payload){
  const upsert = (arr, incoming) => {
    (incoming || []).forEach(item => {
      const idx = arr.findIndex(x => x.id === item.id);
      if (idx >= 0) arr[idx] = item; else arr.push(item);
    });
  };
  upsert(AppState.pathogens, payload.pathogens);
  upsert(AppState.topics, payload.topics);
  upsert(AppState.concepts, payload.concepts);
  upsert(AppState.flashcards, payload.flashcards);
  AppState.progress = { ...AppState.progress, ...(payload.progress || {}) };
}

/* ==========================================================================
   4. CONFIGURACIÓN VISUAL
   ========================================================================== */
function applyConfig(){
  document.documentElement.setAttribute('data-theme', AppState.config.theme);
  document.documentElement.setAttribute('data-font-size', AppState.config.fontSize);
  document.documentElement.setAttribute('data-compact', AppState.config.compact);
  const fs = document.getElementById('cfgFontSize');
  const th = document.getElementById('cfgTheme');
  const cp = document.getElementById('cfgCompact');
  if (fs) fs.value = AppState.config.fontSize;
  if (th) th.value = AppState.config.theme;
  if (cp) cp.value = AppState.config.compact;
}

function setupConfiguration(){
  const fs = document.getElementById('cfgFontSize');
  const th = document.getElementById('cfgTheme');
  const cp = document.getElementById('cfgCompact');
  if (fs) fs.addEventListener('change', () => { AppState.config.fontSize = fs.value; applyConfig(); saveConfigToStorage(); });
  if (th) th.addEventListener('change', () => { AppState.config.theme = th.value; applyConfig(); saveConfigToStorage(); });
  if (cp) cp.addEventListener('change', () => { AppState.config.compact = cp.value; applyConfig(); saveConfigToStorage(); });
}

/* ==========================================================================
   5. NAVEGACIÓN
   ========================================================================== */
function navigateTo(targetId){
  document.querySelectorAll('.section-view').forEach(sec => sec.classList.remove('active'));
  const target = document.getElementById(targetId);
  if (target) target.classList.add('active');

  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.getAttribute('data-target') === targetId);
  });

  document.querySelector('.content-container')?.scrollTo?.(0,0);
  window.scrollTo(0,0);
  closeMobileSidebar();
}

function setupNavigation(){
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => navigateTo(item.getAttribute('data-target')));
  });

  const toggleBtn = document.getElementById('toggleSidebar');
  const sidebar = document.getElementById('sidebar');
  if (toggleBtn && sidebar){
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '›' : '‹';
    });
  }

  const mobileBtn = document.getElementById('mobileMenuBtn');
  const overlay = document.getElementById('sidebarOverlay');
  if (mobileBtn && sidebar && overlay){
    mobileBtn.addEventListener('click', () => {
      sidebar.classList.add('mobile-open');
      overlay.classList.add('show');
    });
    overlay.addEventListener('click', closeMobileSidebar);
  }
}
function closeMobileSidebar(){
  document.getElementById('sidebar')?.classList.remove('mobile-open');
  document.getElementById('sidebarOverlay')?.classList.remove('show');
}

/* ==========================================================================
   6. ESTADÍSTICAS
   ========================================================================== */
function setText(id, value){ const el = document.getElementById(id); if (el) el.textContent = value; }

function updateStats(){
  const p = AppState.pathogens;
  setText('st-total', p.length);
  setText('st-bacterias', p.filter(x => x.type === 'bacteria').length);
  setText('st-virus', p.filter(x => x.type === 'virus').length);
  setText('st-hongos', p.filter(x => x.type === 'fungus').length);
  setText('st-parasitos', p.filter(x => x.type === 'parasite').length);
  setText('st-temas', AppState.topics.length);
  setText('st-conceptos', AppState.concepts.length);
  setText('st-flashcards', AppState.flashcards.length);
}

function updateProgressStats(){
  const values = Object.values(AppState.progress || {});
  const easy = values.filter(v => v.difficulty === 'easy').length;
  const medium = values.filter(v => v.difficulty === 'medium').length;
  const hard = values.filter(v => v.difficulty === 'hard').length;
  const studied = values.length;
  const total = AppState.flashcards.length;
  setText('st-fc-easy', easy);
  setText('st-fc-medium', medium);
  setText('st-fc-hard', hard);
  setText('st-fc-new', Math.max(total - studied, 0));
}

/* ==========================================================================
   7. TEMAS
   ========================================================================== */
function renderTopics(){
  const container = document.getElementById('temasContainer');
  if (!container) return;
  if (!AppState.topics.length){
    container.innerHTML = emptyState('📚', 'Aún no hay temas', 'Agrega patógenos o conceptos y los temas se crearán automáticamente.');
    return;
  }
  container.innerHTML = AppState.topics.map(topic => {
    const countP = AppState.pathogens.filter(p => p.topic === topic.name).length;
    const countC = AppState.concepts.filter(c => c.topic === topic.name).length;
    return `
      <div class="module-card" onclick="filterByTopic('${escapeHTML(topic.name).replace(/'/g,"\\'")}')">
        <div class="card-ribbon" style="background:var(--accent-light); color:var(--accent-color);">TEMA<span>${countP + countC} elemento(s)</span></div>
        <div class="card-body">
          <div class="card-title">${escapeHTML(topic.name)}</div>
          <div class="card-summary">${escapeHTML(topic.description || 'Sin descripción.')}</div>
          <div class="card-dotted"></div>
          <div class="card-meta">${countP} patógeno(s) · ${countC} concepto(s)</div>
        </div>
      </div>`;
  }).join('');
}

function filterByTopic(topicName){
  navigateTo('sec-patogenos');
  const select = document.getElementById('pathogenTopicFilter');
  if (select){ select.value = topicName; }
  renderPathogens();
}

function populateTopicFilters(){
  const selects = [document.getElementById('pathogenTopicFilter'), document.getElementById('fcFilterTopic')];
  selects.forEach(select => {
    if (!select) return;
    const current = select.value;
    select.innerHTML = '<option value="ALL">Todos los temas</option>' +
      AppState.topics.map(t => `<option value="${escapeHTML(t.name)}">${escapeHTML(t.name)}</option>`).join('');
    if ([...select.options].some(o => o.value === current)) select.value = current;
  });
}

/* ==========================================================================
   8. PATÓGENOS
   ========================================================================== */
let pathogenActiveFilter = 'ALL';

function renderPathogens(){
  const grid = document.getElementById('pathogensGrid');
  if (!grid) return;

  const searchTerm = normalizeText(document.getElementById('pathogenSearchInput')?.value || '');
  const topicFilter = document.getElementById('pathogenTopicFilter')?.value || 'ALL';

  let list = AppState.pathogens.slice();
  if (pathogenActiveFilter !== 'ALL') list = list.filter(p => p.type === pathogenActiveFilter);
  if (topicFilter !== 'ALL') list = list.filter(p => p.topic === topicFilter);
  if (searchTerm){
    list = list.filter(p => {
      const haystack = normalizeText([p.name, p.keywords, p.summary, p.subtopic, p.topic].join(' '));
      return haystack.includes(searchTerm);
    });
  }

  if (!list.length){
    grid.innerHTML = emptyState('🔬', 'Sin resultados', 'No se encontraron microorganismos con esos filtros.');
    return;
  }

  grid.innerHTML = list.map(p => `
    <div class="module-card" onclick="openPathogen('${p.id}')">
      <div class="card-ribbon ${getTypeBadgeClass(p.type)}">
        <span>${getTypeIcon(p.type)} ${getTypeLabel(p.type)}</span>
        ${p.isDemo ? '<span class="demo-tag">Demo</span>' : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHTML(p.name)}</div>
        <div class="card-meta">${escapeHTML(p.topic || 'Sin tema')}${p.subtopic ? ' · ' + escapeHTML(p.subtopic) : ''}</div>
        <div class="card-summary">${escapeHTML(p.summary || '')}</div>
      </div>
    </div>`).join('');
}

function setupPathogenFilters(){
  const group = document.getElementById('pathogenFilterGroup');
  if (group){
    group.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        pathogenActiveFilter = btn.getAttribute('data-filter');
        renderPathogens();
      });
    });
  }
  document.getElementById('pathogenSearchInput')?.addEventListener('input', renderPathogens);
  document.getElementById('pathogenTopicFilter')?.addEventListener('change', renderPathogens);
}

function openPathogen(id){
  const p = AppState.pathogens.find(x => x.id === id);
  if (!p) return;
  setText('sheetTitle', p.name);
  setText('sheetSummary', p.summary || '');
  const badge = document.getElementById('sheetBadge');
  if (badge){
    badge.className = 'badge-type ' + getTypeBadgeClass(p.type);
    badge.textContent = getTypeIcon(p.type) + ' ' + getTypeLabel(p.type);
  }
  setText('sheetSubtitles', [p.topic, p.subtopic].filter(Boolean).join(' · '));

  const grid = document.getElementById('sheetSectionsGrid');
  const sections = p.sections || {};
  const keys = Object.keys(sections);
  grid.innerHTML = keys.length
    ? keys.map(k => `
        <div class="section-block">
          <h4>${escapeHTML(k)}</h4>
          <div class="section-block-content">${sanitizeHTML(sections[k])}</div>
        </div>`).join('')
    : emptyState('📖', 'Sin contenido detallado', 'Este patógeno todavía no tiene secciones agregadas.');

  navigateTo('sec-ficha');
}

/* ==========================================================================
   9. TEORÍA / CONCEPTOS
   ========================================================================== */
function renderConcepts(){
  const grid = document.getElementById('teoriaGrid');
  if (!grid) return;
  const searchTerm = normalizeText(document.getElementById('conceptSearchInput')?.value || '');

  let list = AppState.concepts.slice();
  if (searchTerm){
    list = list.filter(c => normalizeText([c.name, c.keywords, c.content, c.topic].join(' ')).includes(searchTerm));
  }

  if (!list.length){
    grid.innerHTML = emptyState('📖', 'Sin conceptos', 'Agrega teoría desde "Agregar contenido".');
    return;
  }

  grid.innerHTML = list.map(c => `
    <div class="module-card" style="cursor:default;">
      <div class="card-ribbon" style="background:var(--accent-light); color:var(--accent-color);">
        <span>📖 CONCEPTO</span>${c.isDemo ? '<span class="demo-tag">Demo</span>' : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHTML(c.name)}</div>
        <div class="card-meta">${escapeHTML(c.topic || 'Sin tema')}</div>
        <div class="card-dotted"></div>
        <div class="card-summary">${sanitizeHTML(c.content || '')}</div>
      </div>
    </div>`).join('');
}

function setupConceptSearch(){
  document.getElementById('conceptSearchInput')?.addEventListener('input', renderConcepts);
}

/* ==========================================================================
   10. FLASHCARDS
   ========================================================================== */
let fcQueue = [];
let fcIndex = 0;
let fcAnswerShown = false;

function getFilteredFlashcards(){
  const topic = document.getElementById('fcFilterTopic')?.value || 'ALL';
  const type = document.getElementById('fcFilterType')?.value || 'ALL';
  const diff = document.getElementById('fcFilterDiff')?.value || 'ALL';

  return AppState.flashcards.filter(fc => {
    if (topic !== 'ALL' && fc.topic !== topic) return false;
    if (type !== 'ALL' && fc.type !== type) return false;
    if (diff !== 'ALL'){
      const current = AppState.progress[fc.id]?.difficulty || 'new';
      if (current !== diff) return false;
    }
    return true;
  });
}

function startFlashcards(){
  fcQueue = getFilteredFlashcards().sort(() => Math.random() - 0.5);
  fcIndex = 0;
  const area = document.getElementById('fcStudyArea');
  if (!fcQueue.length){
    area.style.display = 'block';
    document.getElementById('currentFlashcard').innerHTML = '';
    document.getElementById('fcProgress').textContent = '';
    document.getElementById('fcActionArea').style.display = 'none';
    document.getElementById('fcDifficultyArea').style.display = 'none';
    document.getElementById('currentFlashcard').innerHTML = '<div class="fc-empty">🎴 No hay flashcards con estos filtros.</div>';
    return;
  }
  area.style.display = 'block';
  showCurrentFlashcard();
}

function showCurrentFlashcard(){
  if (fcIndex >= fcQueue.length){
    document.getElementById('currentFlashcard').innerHTML = '<div class="fc-empty">✅ Sesión completada. ¡Buen trabajo!</div>';
    document.getElementById('fcActionArea').style.display = 'none';
    document.getElementById('fcDifficultyArea').style.display = 'none';
    document.getElementById('fcProgress').textContent = `${fcQueue.length} / ${fcQueue.length} completadas`;
    return;
  }
  const fc = fcQueue[fcIndex];
  fcAnswerShown = false;
  document.getElementById('fcProgress').textContent = `Tarjeta ${fcIndex + 1} de ${fcQueue.length}`;
  document.getElementById('currentFlashcard').innerHTML = `
    <div id="fcQuestion" style="font-size:1.2rem; font-weight:600; font-family:var(--font-display);">${escapeHTML(fc.question)}</div>
    <div id="fcAnswer" class="flashcard-answer" style="display:none;">${sanitizeHTML(fc.answer)}</div>`;
  document.getElementById('fcActionArea').style.display = 'block';
  document.getElementById('fcDifficultyArea').style.display = 'none';
}

function showFlashcardAnswer(){
  const answerEl = document.getElementById('fcAnswer');
  if (answerEl) answerEl.style.display = 'block';
  fcAnswerShown = true;
  document.getElementById('fcActionArea').style.display = 'none';
  document.getElementById('fcDifficultyArea').style.display = 'flex';
}

function rateCurrentFlashcard(difficulty){
  const fc = fcQueue[fcIndex];
  if (fc){
    AppState.progress[fc.id] = { difficulty, lastReview: new Date().toISOString() };
    saveToStorage();
    updateProgressStats();
  }
  fcIndex++;
  showCurrentFlashcard();
}

function setupFlashcards(){
  document.getElementById('btnStartFlashcards')?.addEventListener('click', startFlashcards);
  document.getElementById('btnShowAnswer')?.addEventListener('click', showFlashcardAnswer);
  document.getElementById('fcDifficultyArea')?.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-diff]');
    if (btn) rateCurrentFlashcard(btn.getAttribute('data-diff'));
  });
}

/* ==========================================================================
   11. BÚSQUEDA GLOBAL
   ========================================================================== */
function globalSearch(query){
  const term = normalizeText(query);
  if (!term) return { pathogens:[], concepts:[], flashcards:[], topics:[] };

  return {
    pathogens: AppState.pathogens.filter(p => normalizeText([p.name,p.keywords,p.summary,p.topic].join(' ')).includes(term)),
    concepts: AppState.concepts.filter(c => normalizeText([c.name,c.keywords,c.content,c.topic].join(' ')).includes(term)),
    flashcards: AppState.flashcards.filter(f => normalizeText([f.question,f.answer,f.topic].join(' ')).includes(term)),
    topics: AppState.topics.filter(t => normalizeText([t.name,t.description].join(' ')).includes(term))
  };
}

function renderSearchResults(query){
  const container = document.getElementById('searchResultsContainer');
  const results = globalSearch(query);
  const totalCount = results.pathogens.length + results.concepts.length + results.flashcards.length + results.topics.length;

  if (!totalCount){
    container.innerHTML = emptyState('🔍', 'Sin resultados', `No se encontró nada para "${escapeHTML(query)}".`);
    return;
  }

  let html = '';
  if (results.pathogens.length){
    html += `<h2 class="section-heading">🔬 Patógenos</h2><div class="grid-cards" style="margin-bottom:2rem;">` +
      results.pathogens.map(p => `
        <div class="module-card" onclick="openPathogen('${p.id}')">
          <div class="card-ribbon ${getTypeBadgeClass(p.type)}"><span>${getTypeIcon(p.type)} ${getTypeLabel(p.type)}</span></div>
          <div class="card-body"><div class="card-title">${escapeHTML(p.name)}</div><div class="card-summary">${escapeHTML(p.summary||'')}</div></div>
        </div>`).join('') + `</div>`;
  }
  if (results.concepts.length){
    html += `<h2 class="section-heading">📖 Conceptos</h2><div class="grid-cards" style="margin-bottom:2rem;">` +
      results.concepts.map(c => `
        <div class="module-card" style="cursor:default;" onclick="navigateTo('sec-teoria')">
          <div class="card-ribbon" style="background:var(--accent-light); color:var(--accent-color);"><span>📖 CONCEPTO</span></div>
          <div class="card-body"><div class="card-title">${escapeHTML(c.name)}</div><div class="card-summary">${sanitizeHTML(c.content||'')}</div></div>
        </div>`).join('') + `</div>`;
  }
  if (results.flashcards.length){
    html += `<h2 class="section-heading">🎴 Flashcards</h2><div class="grid-cards" style="margin-bottom:2rem;">` +
      results.flashcards.map(f => `
        <div class="module-card" style="cursor:default;" onclick="navigateTo('sec-flashcards')">
          <div class="card-ribbon" style="background:var(--accent-light); color:var(--accent-color);"><span>🎴 FLASHCARD</span></div>
          <div class="card-body"><div class="card-title">${escapeHTML(f.question)}</div></div>
        </div>`).join('') + `</div>`;
  }
  if (results.topics.length){
    html += `<h2 class="section-heading">📚 Temas</h2><div class="grid-cards">` +
      results.topics.map(t => `
        <div class="module-card" onclick="filterByTopic('${escapeHTML(t.name).replace(/'/g,"\\'")}')">
          <div class="card-ribbon" style="background:var(--accent-light); color:var(--accent-color);"><span>📚 TEMA</span></div>
          <div class="card-body"><div class="card-title">${escapeHTML(t.name)}</div><div class="card-summary">${escapeHTML(t.description||'')}</div></div>
        </div>`).join('') + `</div>`;
  }
  container.innerHTML = html;
}

function setupGlobalSearch(){
  const input = document.getElementById('globalSearchInput');
  if (!input) return;
  input.addEventListener('input', () => {
    const query = input.value.trim();
    if (!query){
      navigateTo('sec-inicio');
      return;
    }
    renderSearchResults(query);
    navigateTo('sec-search-results');
  });
}

/* ==========================================================================
   13. IMPORTADOR DE MÓDULOS HTML
   ========================================================================== */
function setupModuleImporter(){
  const btn = document.getElementById('btnImportModule');
  const feedback = document.getElementById('importFeedback');

  btn?.addEventListener('click', async () => {
    const raw = document.getElementById('importCodeInput')?.value.trim();
    if (!raw){
      feedback.style.color = '#b91c1c';
      feedback.textContent = 'Pega un módulo HTML antes de importar.';
      return;
    }

    try{
      const template = document.createElement('template');
      template.innerHTML = raw;
      const modules = template.content.querySelectorAll('[data-module-type]');

      if (!modules.length){
        feedback.style.color = '#b91c1c';
        feedback.textContent = 'No se encontró ningún elemento con data-module-type="pathogen|concept|flashcard".';
        return;
      }

      let importedCount = 0, rejectedCount = 0;

      modules.forEach(mod => {
        const modType = mod.getAttribute('data-module-type');
        const id = mod.getAttribute('data-id') || ('mod-' + Date.now() + '-' + Math.floor(Math.random()*1000));

        const ensureTopic = (topic, origin) => {
          if (topic && !AppState.topics.some(t => t.name === topic)){
            AppState.topics.push({ id:'topic-'+topic, name:topic, description:'Tema creado automáticamente por módulo de ' + origin + '.' });
          }
        };

        if (modType === 'pathogen'){
          const name = mod.getAttribute('data-name');
          const type = mod.getAttribute('data-type');
          const topic = mod.getAttribute('data-topic');
          const subtopic = mod.getAttribute('data-subtopic');
          const summary = mod.getAttribute('data-summary');
          const keywords = mod.getAttribute('data-keywords');
          const sections = {};
          mod.querySelectorAll('[data-section]').forEach(sec => {
            const secName = sec.getAttribute('data-section');
            if (secName) sections[secName] = sanitizeHTML(sec.innerHTML);
          });
          const newItem = { id, name, type, topic, subtopic, summary, keywords, sections };
          const idx = AppState.pathogens.findIndex(p => p.id === id);
          if (idx >= 0) AppState.pathogens[idx] = newItem; else AppState.pathogens.push(newItem);
          ensureTopic(topic, 'patógeno');
          importedCount++;
        }
        else if (modType === 'concept'){
          const name = mod.getAttribute('data-name');
          const topic = mod.getAttribute('data-topic');
          const keywords = mod.getAttribute('data-keywords');
          const content = sanitizeHTML(mod.innerHTML);
          const newItem = { id, name, topic, keywords, content };
          const idx = AppState.concepts.findIndex(c => c.id === id);
          if (idx >= 0) AppState.concepts[idx] = newItem; else AppState.concepts.push(newItem);
          ensureTopic(topic, 'concepto');
          importedCount++;
        }
        else if (modType === 'flashcard'){
          const question = mod.querySelector('[data-field="question"]')?.textContent || '';
          const answer = sanitizeHTML(mod.querySelector('[data-field="answer"]')?.innerHTML || '');
          const topic = mod.getAttribute('data-topic');
          const type = mod.getAttribute('data-type');
          const newItem = { id, question, answer, topic, type };
          const idx = AppState.flashcards.findIndex(f => f.id === id);
          if (idx >= 0) AppState.flashcards[idx] = newItem; else AppState.flashcards.push(newItem);
          ensureTopic(topic, 'flashcard');
          importedCount++;
        }
        else{
          rejectedCount++;
        }
      });

      await saveToStorage();
      refreshAllViews();

      feedback.style.color = '#1f6b3a';
      feedback.textContent = `Importación completada: ${importedCount} módulo(s) importados/actualizados (${rejectedCount} rechazados).`;
      const input = document.getElementById('importCodeInput');
      if (input) input.value = '';

    }catch(err){
      feedback.style.color = '#b91c1c';
      feedback.textContent = 'Error procesando el HTML ingresado: ' + err.message;
      console.error(err);
    }
  });

  document.getElementById('btnExportLibrary')?.addEventListener('click', exportLibraryJSON);

  document.getElementById('libraryJsonInput')?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (file) importLibraryJSON(file);
    e.target.value = '';
  });

  document.getElementById('btnClearLibrary')?.addEventListener('click', async () => {
    const confirmed = confirm('¿Estás seguro de que deseas eliminar todo el contenido personalizado y restablecer los datos de demostración? Esta acción no se puede deshacer.');
    if (!confirmed) return;
    applyLibraryPayload(cloneData(DEMO_DATA));
    await saveToStorage();
    refreshAllViews();
    alert('Biblioteca restablecida.');
  });
}

} else {
