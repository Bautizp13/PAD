<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicación en Salud · Flashcards</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--mute:#6b7785;--bd:#d9e0e6;
--term:#0f766e;--termbg:#e8f3f2;--teo:#7c3aed;--teobg:#f1ebfd}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#1a232c;--ink:#e8eef3;--mute:#93a1ae;--bd:#2b3743;
--term:#2dd4bf;--termbg:#16302e;--teo:#a78bfa;--teobg:#2a2142}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.2rem;margin:4px 0 12px;text-align:center}
.tabs{display:flex;gap:6px;width:100%;max-width:560px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 6px;font-weight:600;font-size:.9rem}
.tabs button.on{color:#fff;border-color:transparent}
.tabs button[data-m=term].on{background:var(--term)}
.tabs button[data-m=teo].on{background:var(--teo)}
.tabs button[data-m=mix].on{background:linear-gradient(90deg,var(--term),var(--teo))}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:560px;margin-bottom:6px}
select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}
.stat{color:var(--mute);font-size:.9rem;margin:6px 0;text-align:center}
.scene{width:100%;max-width:560px;margin:8px 0}
.card{width:100%;cursor:pointer}
.face{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--c);border-radius:18px;padding:48px 20px 40px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08);position:relative;animation:fade .25s}
.card[data-t=term]{--c:var(--term);--cbg:var(--termbg)}
.card[data-t=teo]{--c:var(--teo);--cbg:var(--teobg)}
.back{background:var(--cbg);display:none}
.card.flip .front{display:none}
.card.flip .back{display:flex}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.badge{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--mute);text-align:left}
.pill{background:var(--c);color:#fff;padding:3px 9px;border-radius:99px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.cat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt{font-size:1.15rem;line-height:1.5;word-break:break-word}
.term{font-size:1.6rem;font-weight:700;color:var(--c);word-break:break-word}
.hint{position:absolute;bottom:12px;font-size:.75rem;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.ok{background:var(--term);color:#fff;border-color:var(--term)}

.nav{display:flex;gap:6px;width:100%;max-width:560px;margin-bottom:12px}
.nav button{flex:1;padding:10px;font-weight:700}
.nav button.on{background:#1d2733;color:#fff;border-color:#1d2733}
@media(prefers-color-scheme:dark){.nav button.on{background:#e8eef3;color:#10161c;border-color:#e8eef3}}
.btnlike{display:inline-block;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
#sec-pdf{display:none;width:100%;max-width:820px;flex-direction:column;align-items:center}
#pdfwrap{width:100%;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:8px;max-height:75vh;text-align:center;-webkit-overflow-scrolling:touch}
#pdfwrap canvas{display:block;margin:0 auto}
#pgin{width:60px;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);text-align:center}
.small{color:var(--mute);font-size:.8rem;text-align:center;max-width:560px;margin:6px 0}
</style>
</head>
<body>
<h1>Habilidades de comunicación en salud</h1>

<div class="nav" id="nav">
  <button data-s="cards" class="on">Flashcards</button>
  <button data-s="pdf">PDFs</button>
</div>
<div id="sec-cards" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="tabs" id="tabs">
  <button data-m="term">Terminología</button>
  <button data-m="teo">Teoría</button>
  <button data-m="mix">Todo mezclado</button>
</div>
<div class="bar">
  <select id="cat"></select>
  <select id="mode">
    <option value="d">Descripción → Término</option>
    <option value="t">Término → Descripción</option>
  </select>
  <select id="filt">
    <option value="all">Todas</option>
    <option value="rep">Solo no sabidas</option>
  </select>
  <button id="shuf">Mezclar</button>
</div>
<div class="stat" id="stat"></div>

<div class="scene"><div class="card" id="card" data-t="term">
  <div class="face front"><div class="badge"><span class="pill" id="pf"></span><span class="cat" id="cf"></span></div><div class="txt" id="ft"></div><span class="hint">Toca para voltear</span></div>
  <div class="face back"><div class="badge"><span class="pill" id="pb"></span><span class="cat" id="cb"></span></div><div id="bt"></div></div>
</div></div>

<div class="row">
  <button id="prev">← Anterior</button>
  <button id="rep">Repasar</button>
  <button id="ok" class="ok">Lo sé</button>
  <button id="next">Siguiente →</button>
</div>
</div>

<div id="sec-pdf">
  <div class="bar" style="max-width:820px">
    <select id="pdfsel"></select>
    <label class="btnlike">Abrir PDF de mi dispositivo<input type="file" id="pdffile" accept="application/pdf" hidden></label>
  </div>
  <div class="stat" id="pdfmsg"></div>
  <div class="row" id="pdftools" style="display:none">
    <button id="pp">←</button>
    <input type="number" id="pgin" min="1" inputmode="numeric"><span class="stat" id="pinfo"></span>
    <button id="pn">→</button>
    <button id="zo">−</button><button id="zi">+</button><button id="zf">Ajustar</button>
    <a id="pdfopen" class="btnlike" target="_blank" rel="noopener">Abrir aparte</a>
  </div>
  <div id="pdfwrap" style="display:none"><canvas id="pdfc"></canvas></div>
  <div class="small">Los PDFs abiertos desde tu dispositivo se ven solo en esta sesión. Para dejarlos guardados, subilos a la carpeta pdfs del repo y agregalos en pdfs.js.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" onerror="window.ERR_PDF=1"></script>
<script src="pdfs.js?v=1"></script>
<script src="terminologia.js?v=3" onerror="window.ERR_T=1"></script>
<script src="teoria.js?v=3" onerror="window.ERR_E=1"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "comsalud_v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

const T = (typeof TERMINOLOGIA !== "undefined" ? TERMINOLOGIA : []).map(c => ({...c, tipo:"term"}));
const E = (typeof TEORIA !== "undefined" ? TEORIA : []).map(c => ({...c, tipo:"teo"}));
const ALL = [...T, ...E];
// terminología conserva su id anterior para no perder el progreso guardado
const id = c => (c.tipo === "teo" ? "teo|" : "") + c.cat + "|" + c.t;
const LABEL = { term:"Terminología", teo:"Teoría" };

let modo = "term", deck = [], i = 0;
try { modo = localStorage.getItem(KEY + "_m") || "term"; } catch(e) {}
if (!["term","teo","mix"].includes(modo)) modo = "term";

const pool = () => modo === "mix" ? ALL : modo === "teo" ? E : T;

function fillCats() {
  const cats = [...new Set(pool().map(c => c.cat))];
  $("cat").innerHTML = '<option value="">Todas las categorías</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join("");
}

function setMode(m) {
  modo = m;
  try { localStorage.setItem(KEY + "_m", m); } catch(e) {}
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  fillCats(); build(false);
}

function build(shuffle) {
  deck = pool().filter(c => (!$("cat").value || c.cat === $("cat").value) &&
    ($("filt").value === "all" || state[id(c)] !== "ok"));
  if (shuffle || modo === "mix") deck.sort(() => Math.random() - .5);
  i = 0; render();
}

function render() {
  const c = $("card"); c.classList.remove("flip");
  if (!deck.length) {
    let msg = "No hay tarjetas en este filtro.";
    if (!pool().length) msg = (modo === "teo" ? window.ERR_E : window.ERR_T) ? "No se pudo cargar el archivo de tarjetas. Verificá que esté en la misma carpeta que index.html." : "Todavía no hay tarjetas en esta sección.";
    $("ft").textContent = msg; $("bt").innerHTML = ""; $("pf").textContent = ""; $("pb").textContent = "";
    $("cf").textContent = ""; $("cb").textContent = ""; $("stat").textContent = ""; return;
  }
  const k = deck[i], termFirst = $("mode").value === "t";
  c.dataset.t = k.tipo;
  const term = `<div class="term">${k.t}</div>`, desc = `<div class="txt">${k.d}</div>`;
  $("ft").innerHTML = termFirst ? term : desc;
  $("bt").innerHTML = termFirst ? desc : term;
  ["pf","pb"].forEach(x => $(x).textContent = LABEL[k.tipo]);
  ["cf","cb"].forEach(x => $(x).textContent = k.cat);
  const known = pool().filter(x => state[id(x)] === "ok").length;
  $("stat").textContent = `Tarjeta ${i + 1} de ${deck.length} · Sabidas: ${known}/${pool().length}`;
}

const go = d => { if (deck.length) { i = (i + d + deck.length) % deck.length; render(); } };
const mark = v => { if (!deck.length) return; state[id(deck[i])] = v; save(); go(1); };

$("card").onclick = () => $("card").classList.toggle("flip");
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("ok").onclick = () => mark("ok");
$("rep").onclick = () => mark("rep");
$("shuf").onclick = () => build(true);
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setMode(b.dataset.m));
["cat", "mode", "filt"].forEach(x => $(x).onchange = () => build(false));
document.onkeydown = e => {
  if (seccion === "pdf") { if (e.key === "ArrowRight") pdfGo(1); else if (e.key === "ArrowLeft") pdfGo(-1); return; }
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " ") { e.preventDefault(); $("card").classList.toggle("flip"); }
};
setMode(modo);

// ================= SECCIONES =================
let seccion = "cards";
function setSec(x) {
  seccion = x;
  $("sec-cards").style.display = x === "cards" ? "flex" : "none";
  $("sec-pdf").style.display = x === "pdf" ? "flex" : "none";
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.s === x));
  if (x === "pdf") { initPdfList(); if (pdfDoc) renderPdf(); }
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => setSec(b.dataset.s));

// ================= VISOR DE PDF =================
const LISTA_PDF = (typeof PDFLIST !== "undefined") ? PDFLIST : [];
const WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdfDoc = null, pdfPage = 1, pdfZoom = 1, pdfBusy = false, pdfAgain = false, pdfKey = "", pdfListReady = false;

function pdfMsg(t) { $("pdfmsg").textContent = t || ""; }

function initPdfList() {
  if (pdfListReady) return; pdfListReady = true;
  $("pdfsel").innerHTML = '<option value="">Elegí un PDF…</option>' + LISTA_PDF.map((p, n) => `<option value="${n}">${p.titulo}</option>`).join("");
  if (!LISTA_PDF.length) pdfMsg("Todavía no hay PDFs en la lista. Abrí uno desde tu dispositivo o agregalos en pdfs.js.");
}

async function openPdf(url, key) {
  if (!window.pdfjsLib) { pdfMsg("No se pudo cargar el visor de PDF. Revisá tu conexión o usá Abrir aparte."); $("pdfopen").href = url; $("pdftools").style.display = "flex"; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER;
  pdfMsg("Cargando…");
  try {
    pdfDoc = await pdfjsLib.getDocument(url).promise;
    pdfKey = "pdfpos|" + key;
    let p = 1; try { p = parseInt(localStorage.getItem(pdfKey)) || 1; } catch(e) {}
    pdfPage = Math.min(Math.max(1, p), pdfDoc.numPages); pdfZoom = 1;
    $("pdfopen").href = url; $("pgin").max = pdfDoc.numPages;
    $("pdftools").style.display = "flex"; $("pdfwrap").style.display = "block";
    pdfMsg(""); renderPdf();
  } catch (e) {
    pdfMsg("No se pudo abrir el PDF. Verificá que el archivo esté en la carpeta pdfs y que el nombre coincida exactamente.");
  }
}

async function renderPdf() {
  if (!pdfDoc) return;
  if (pdfBusy) { pdfAgain = true; return; }
  pdfBusy = true;
  try {
    const page = await pdfDoc.getPage(pdfPage);
    const base = page.getViewport({ scale: 1 });
    const wrap = $("pdfwrap");
    const fit = (wrap.clientWidth - 2) / base.width;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({ scale: fit * pdfZoom * dpr });
    const c = $("pdfc");
    c.width = vp.width; c.height = vp.height;
    c.style.width = (vp.width / dpr) + "px"; c.style.height = (vp.height / dpr) + "px";
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    $("pgin").value = pdfPage; $("pinfo").textContent = "de " + pdfDoc.numPages;
    wrap.scrollTop = 0;
    try { localStorage.setItem(pdfKey, pdfPage); } catch(e) {}
  } catch (e) { pdfMsg("Error al mostrar la página."); }
  pdfBusy = false;
  if (pdfAgain) { pdfAgain = false; renderPdf(); }
}

function pdfGo(d) { if (!pdfDoc) return; const n = pdfPage + d; if (n >= 1 && n <= pdfDoc.numPages) { pdfPage = n; renderPdf(); } }
function pdfZ(f) { pdfZoom = Math.min(4, Math.max(.5, f)); renderPdf(); }

$("pdfsel").onchange = () => { const p = LISTA_PDF[$("pdfsel").value]; if (p) openPdf(p.archivo, p.archivo); };
$("pdffile").onchange = e => { const f = e.target.files[0]; if (f) { $("pdfsel").value = ""; openPdf(URL.createObjectURL(f), "local|" + f.name + "|" + f.size); } };
$("pp").onclick = () => pdfGo(-1);
$("pn").onclick = () => pdfGo(1);
$("zi").onclick = () => pdfZ(pdfZoom + .25);
$("zo").onclick = () => pdfZ(pdfZoom - .25);
$("zf").onclick = () => pdfZ(1);
$("pgin").onchange = () => { const n = parseInt($("pgin").value); if (pdfDoc && n >= 1 && n <= pdfDoc.numPages) { pdfPage = n; renderPdf(); } else $("pgin").value = pdfPage; };
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (seccion === "pdf") renderPdf(); }, 250); });
</script>
</body>
</html>
